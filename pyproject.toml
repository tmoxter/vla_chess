[project]
name = "vla-chess"
version = "0.1.0"
description = "Simulated chess pick-and-place trajectory generation for VLA fine-tuning"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vla_chess"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.activation.env]
MUJOCO_GL = "osmesa"
PYOPENGL_PLATFORM = "osmesa"

[tool.pixi.dependencies]
python = ">=3.11,<3.13"
mujoco = ">=3.2"
mesalib = "24.*"
numpy = ">=1.26"
ffmpeg = ">=6.0"

[tool.pixi.pypi-dependencies]
mink = ">=0.0.4"
vla-chess = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"
mypy = ">=1.11"
ruff = ">=0.6"

# The LeRobot dataset writer's dependencies, kept in their own environment. lerobot 0.6.1 caps
# numpy below 2.3 while the default env floats it to 2.5, so `datagen` gets its own solve-group
# and pins numpy into the window both lerobot and mujoco accept — the default env is untouched.
# torch and friends come from PyTorch's CPU index: this host has no GPU, and the default index
# would drag ~5 GB of unusable CUDA wheels onto it. Versions are the ones a 2026-08-17 probe
# verified end to end (create -> add_frame -> save_episode -> finalize -> offline readback).
[tool.pixi.feature.datagen.dependencies]
numpy = ">=1.26,<2.3"
# lerobot 0.6.1 (and its `datasets` dep) cap packaging and fsspec below versions the conda
# solve would otherwise float to; pin both into the window they accept.
packaging = ">=24.2,<26"
fsspec = ">=2023.1.0,<=2026.2.0"

[tool.pixi.feature.datagen.pypi-dependencies]
lerobot = { version = "==0.6.1", extras = ["dataset"] }
torch = { version = "==2.11.0", index = "https://download.pytorch.org/whl/cpu" }
torchvision = { version = "==0.26.0", index = "https://download.pytorch.org/whl/cpu" }
torchcodec = { version = "==0.11.1", index = "https://download.pytorch.org/whl/cpu" }

# Policy-inference environment for the SmolVLA rollout eval. Mirrors `datagen`'s pins but adds
# lerobot's `smolvla` extra (transformers/num2words/accelerate) so we can load and run a fine-tuned
# checkpoint. Kept in its own solve-group so pulling in transformers can never perturb the
# end-to-end-verified `datagen` writer env. torch stays on the CPU index — this host has no GPU.
[tool.pixi.feature.eval.dependencies]
numpy = ">=1.26,<2.3"
packaging = ">=24.2,<26"
fsspec = ">=2023.1.0,<=2026.2.0"

[tool.pixi.feature.eval.pypi-dependencies]
lerobot = { version = "==0.6.1", extras = ["dataset", "smolvla"] }
torch = { version = "==2.11.0", index = "https://download.pytorch.org/whl/cpu" }
torchvision = { version = "==0.26.0", index = "https://download.pytorch.org/whl/cpu" }
torchcodec = { version = "==0.11.1", index = "https://download.pytorch.org/whl/cpu" }

# Experiment tracking: a local MLflow with a SQLite backend store. Kept in its own solve-group so
# MLflow's web stack never perturbs the training/eval/writer envs. The pod emits a metrics JSONL
# during training (on its persistent volume); a local ingest script replays it into this SQLite DB.
[tool.pixi.feature.track.pypi-dependencies]
mlflow = ">=2.16"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
datagen = { features = ["dev", "datagen"], solve-group = "datagen" }
eval = { features = ["dev", "eval"], solve-group = "eval" }
track = { features = ["track"], solve-group = "track" }

[tool.pixi.tasks]
install-hooks = "git config core.hooksPath .githooks"
test = "pytest -m 'not slow' tests/unit"
test-slow = "pytest -m slow tests"
# The dataset writer's tests import lerobot, so they only load in the datagen env. They live
# outside tests/unit so the default `test` task never tries to import lerobot: run them with
# `pixi run -e datagen test-dataset`.
test-dataset = "pytest tests/datagen"
bench-render = "python -m vla_chess.cli.bench_render"
reachability-probe = "python -m vla_chess.cli.reachability_probe"
gripper-probe = "python -m vla_chess.cli.gripper_probe"
ik-report = "python -m vla_chess.cli.ik_report"
solve-reference-grasps = "python -m vla_chess.cli.solve_reference_grasps"
render-reference-views = "python -m vla_chess.cli.render_reference_views"
generate-episode = "python -m vla_chess.cli.generate_episode"
# Batch generation writes a LeRobot dataset, so it runs in the datagen env:
# `pixi run -e datagen generate-dataset --episodes 30`.
generate-dataset = "python -m vla_chess.cli.generate_dataset"
search-survey-pose = "python -m vla_chess.cli.search_survey_pose"
# Closed-loop SmolVLA rollout eval; imports lerobot, so it runs in the eval env:
# `pixi run -e eval eval-rollout --episode 0 --out runpod/artifacts/rollout-ep0.mp4`.
eval-rollout = "python -m vla_chess.cli.eval_rollout"
# Local MLflow UI + tracking server (SQLite backend). Run in the track env:
# `pixi run -e track mlflow-server`, then open http://127.0.0.1:5000.
mlflow-server = "mlflow server --backend-store-uri sqlite:///mlflow/mlflow.db --default-artifact-root ./mlflow/artifacts --host 127.0.0.1 --port 5000"
typecheck = "mypy src"
lint = "ruff check . && ruff format --check ."
format = "ruff format ."
precommit = { depends-on = ["lint", "typecheck", "test"] }

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "slow: test is CPU-expensive and opt-in (deselected by default in the `test` task)",
    "render: test requires the osmesa software renderer",
]

[tool.mypy]
mypy_path = ["src"]
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = ["mujoco", "mujoco.*", "scipy", "scipy.*"]
ignore_missing_imports = true

# lerobot, torch and huggingface_hub are only installed in the datagen/eval envs, but `mypy src`
# runs in default; treat them as untyped third-party modules there rather than failing on the
# missing import (they are imported lazily inside the eval-only rollout CLI).
[[tool.mypy.overrides]]
module = ["lerobot.*", "torch", "huggingface_hub"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ANN", "RUF"]
allowed-confusables = ["×"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN401"]
# The rollout CLI drives a lerobot policy object that is only typed in the eval env; its handles
# (policy/pre/post) cross into this module as `Any`, which is exactly what ANN401 guards against.
"src/vla_chess/cli/eval_rollout.py" = ["ANN401"]
